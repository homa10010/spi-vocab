    <meta name="theme-color" content="#2b4a8c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SPI言語" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>SPI言語対策</title>
    <script>
      // 保存したテーマを最初の描画より前に当てて、ダークモードで一瞬白くなるのを防ぐ
      try {
        var s = JSON.parse(localStorage.getItem('spi-vocab-progress-v1') || '{}').settings || {};
        document.documentElement.dataset.theme = s.themeMode || 'light';
        document.documentElement.dataset.accent = s.accent || 'ai';
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
